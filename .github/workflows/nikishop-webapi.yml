name: Build NikiShop Web API

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Ecommerce/NikiShop/NikiShop.Ecommerce.WebApi/**'
      - '.github/workflows/nikishop-webapi.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Ecommerce/NikiShop/NikiShop.Ecommerce.WebApi/**'
      - '.github/workflows/nikishop-webapi.yml'

jobs:
  build:
    name: Build Web API
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '5.0.x' # Configured for the net5.0 target framework

    - name: Restore dependencies
      run: dotnet restore Ecommerce/NikiShop/NikiShop.Ecommerce.WebApi/NikiShop.Ecommerce.WebApi.csproj

    - name: Build Web API
      run: dotnet build Ecommerce/NikiShop/NikiShop.Ecommerce.WebApi/NikiShop.Ecommerce.WebApi.csproj --no-restore --configuration Release
