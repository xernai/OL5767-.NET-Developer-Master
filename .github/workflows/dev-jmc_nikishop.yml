# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - nikishop

on:
  push:
    branches:
      - dev/jmc
  workflow_dispatch:
  
env:
  AZURE_WEBAPP_NAME: 'nikishop'              # Nombre de tu Azure Web App
  AZURE_WEBAPP_PACKAGE_PATH: './publish'     # Carpeta destino para la publicación
  DOTNET_ROOT: 'Ecommerce/NikiShop/NikiShop.Ecommerce.WebApi/NikiShop.Ecommerce.WebApi.csproj'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 'v5.0'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/${{env.AZURE_WEBAPP_NAME}}"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: "${{env.DOTNET_ROOT}}/${{env.AZURE_WEBAPP_NAME}}"

  deploy:
    runs-on: windows-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nikishop'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BFBF513F288C42B8B8F2D79AB0610198 }}
