name: Build NikiShop Web API

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Ecommerce/NikiShop/NikiShop.Ecommerce.WebApi/**'
      - '.github/workflows/dev-jmc_nikishop.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Ecommerce/NikiShop/NikiShop.Ecommerce.WebApi/**'
      - '.github/workflows/dev-jmc_nikishop.yml'
      
env:
  AZURE_WEBAPP_NAME: 'nikishop'              # Nombre de tu Azure Web App
  AZURE_WEBAPP_PACKAGE_PATH: './publish'     # Carpeta destino para la publicación
  
jobs:
  build:
    name: Build Web API
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '5.0.x' # Configured for the net5.0 target framework

    - name: Restore dependencies
      run: dotnet restore Ecommerce/NikiShop/NikiShop.Ecommerce.WebApi/NikiShop.Ecommerce.WebApi.csproj

    - name: Build Web API
      run: dotnet build Ecommerce/NikiShop/NikiShop.Ecommerce.WebApi/NikiShop.Ecommerce.WebApi.csproj --no-restore --configuration Release
      
    # --- NUEVOS PASOS PARA EL DESPLIEGUE ---
    - name: Publish Web API
      run: dotnet publish Ecommerce/NikiShop/NikiShop.Ecommerce.WebApi/NikiShop.Ecommerce.WebApi.csproj -c Release -o ${{ env.AZURE_WEBAPP_PACKAGE_PATH }} --no-build

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BFBF513F288C42B8B8F2D79AB0610198 }} # Secret que debes agregar en tu repositorio de GitHub
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
